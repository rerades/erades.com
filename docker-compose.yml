services:
  erades-com:
    container_name: erades-com
    # Fijado a amd64 a propósito. La imagen de Playwright es multi-arch: en un
    # Mac Apple Silicon sale arm64 y en los runners de GitHub amd64, y el
    # rasterizado de fuentes no coincide entre las dos. Unas baselines generadas
    # en local fallaban en CI por ~235 px, que es justo lo que antes tapaba el
    # maxDiffPixels: 1000. Con la arquitectura fijada, la captura es la misma en
    # todas partes y el umbral puede ser estricto.
    #
    # ponytail: en Apple Silicon esto corre emulado y tarda mas. Si molesta, la
    # alternativa es generar las baselines en CI y descargarlas.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.visual-test
      platforms:
        - linux/amd64
    # Monta el repo, pero NO compartas node_modules
    volumes:
      - .:/tests:delegated
      - tests-node-modules:/tests/node_modules
      - pnpm-store:/root/.local/share/pnpm
      - playwright-cache:/root/.cache/ms-playwright
    # Resuelve host.docker.internal también en Linux (GitHub runners)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # BASE_URL = servidor Astro corriendo en tu HOST (fuera del contenedor)
      BASE_URL: "http://host.docker.internal:4321"
      CI: "${CI:-false}"
    shm_size: "1g" # evita crashes de Chromium
    # No arrancamos servidor aquí. Solo runner de tests visuales.
    command: ["pnpm", "exec", "playwright", "test", "--config=playwright.visual.config.ts"]

volumes:
  tests-node-modules:
  pnpm-store:
  playwright-cache:
