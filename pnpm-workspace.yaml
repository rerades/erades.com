packages:
  - .

overrides:
  mdast-util-to-hast: '>=13.2.1'
  # Avisos de seguridad en transitivas que sus padres aún no han bumpeado
  # (sobre todo @lhci/cli y lighthouse). Revisar al actualizar esos paquetes.
  ajv@8: ^8.18.0
  basic-ftp: ^5.3.1
  body-parser@1: ^1.20.6
  brace-expansion@1: ^1.1.18
  fast-uri: ^3.1.6
  flatted: ^3.4.2
  ip-address: ^10.3.1
  js-yaml@3: ^3.15.2
  lodash: ^4.17.24
  lodash-es: ^4.17.24
  minimatch@3: ^3.1.4
  path-to-regexp@0: ^0.1.13
  picomatch@2: ^2.3.2
  postcss: ^8.5.23
  postcss-selector-parser@7: ^7.1.3
  qs@6: ^6.16.0
  smol-toml: ^1.6.1
  tmp: ^0.2.6
  # Cierra GHSA-w5hq-g745-h8pq. @lhci/cli declara ^8.3.x, pero uuid v11 sigue
  # exportando CJS, así que su `require("uuid").v4` sigue funcionando:
  # comprobado corriendo `lhci collect` de principio a fin.
  uuid: ^11.1.1
  # Cierra GHSA-jmr9-qjv8-65gv y GHSA-7pqw-9j4j-h8q3: extract-zip no tiene
  # versión parcheada, pero @puppeteer/browsers 3 ya no depende de él.
  # puppeteer-core@24 (vía lighthouse 12.6.1 de @lhci/cli) pide ^2; los
  # exports que usa siguen en la 3: comprobado corriendo `pnpm lh:collect`
  # de principio a fin contra producción.
  '@puppeteer/browsers': 3.2.2
  ws@7: ^7.5.11
  ws@8: ^8.21.0

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: false
  sharp: false

