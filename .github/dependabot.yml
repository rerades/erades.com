version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "rerades"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    # Un solo PR con todos los minor/patch. Los major siguen saliendo sueltos,
    # que es donde de verdad hay que mirar el changelog.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        # Fuera del grupo: su version tiene que ir a la par con el tag de la
        # imagen `container:` del job Visual-Regression-Tests (ci.yml), asi
        # que hay que verla venir sola.
        exclude-patterns:
          - "@playwright/test"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for these packages
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "rerades"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
      - "github-actions"
    # Aqui casi todo son major (v4 -> v5), asi que van todas juntas en un PR.
    groups:
      github-actions:
        patterns:
          - "*"
