name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: >-
          Regenerar las baselines visuales y subirlas como artefacto
          `playwright-updated-snapshots`, en vez de comparar contra ellas.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.13.x

jobs:
  Lint:
    name: Lint-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  Type-Check:
    name: Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  Unit-Tests:
    name: Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  E2E-Tests:
    name: E2E-Tests
    runs-on: ubuntu-latest
    # env:
    #  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  Visual-Regression-Tests:
    name: Visual-Regression-Tests
    runs-on: ubuntu-latest
    # El job corre DENTRO de la imagen oficial de Playwright, en vez de construir
    # una imagen propia (Dockerfile.visual-test) y lanzar el runner con docker
    # compose. Motivo: en el desglose del job, construir esa imagen costaba 111s
    # frente a 74s de tests reales, o sea el 60% del tiempo no era testear.
    #
    # Las baselines siguen siendo validas porque es exactamente la misma imagen
    # que usaba docker-compose, luego mismas fuentes y mismo rasterizado. El
    # `platform: linux/amd64` del compose deja de hacer falta: el runner de
    # GitHub ya es amd64 nativo.
    #
    # Como el servidor y los tests viven ahora en el mismo contenedor, la URL es
    # 127.0.0.1 y desaparece todo el baile de host.docker.internal.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --shm-size=1g
    env:
      PORT: 4321
      HOST: 0.0.0.0
      BASE_URL: http://127.0.0.1:4321
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PUBLIC_GA_MEASUREMENT_ID
        run: |
          if [ -z "$PUBLIC_GA_MEASUREMENT_ID" ]; then
            echo "Error: PUBLIC_GA_MEASUREMENT_ID is not configured in GitHub repository variables"
            echo "Please configure it in: Settings -> Secrets and variables -> Actions -> Variables"
            exit 1
          fi
          echo "PUBLIC_GA_MEASUREMENT_ID is configured"
      - name: Build app
        run: pnpm build
      - name: Start server
        run: |
          nohup env PORT=$PORT HOST=$HOST pnpm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL" >/dev/null; then echo "Server is up"; break; fi
            sleep 2
          done
      - name: Run visual tests
        if: ${{ !inputs.update_visual_snapshots }}
        run: pnpm run test:visual:ci
      # Las baselines son autoritativas desde CI: el rasterizado de texto pequeno
      # no coincide entre un amd64 nativo y el amd64 emulado de un Mac Apple
      # Silicon, asi que generarlas en local produce diffs de ~250 px que no se
      # pueden distinguir de una regresion de verdad sin aflojar el umbral.
      # Para refrescarlas: lanzar este workflow con update_visual_snapshots=true
      # y descomprimir el artefacto sobre tests/visual-regression/.
      - name: Regenerate visual baselines
        if: ${{ inputs.update_visual_snapshots }}
        run: pnpm run test:visual:ci:update
      - name: Upload regenerated baselines
        if: ${{ inputs.update_visual_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-updated-snapshots
          path: tests/visual-regression/**/*.png
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: playwright-report
      - name: Upload Playwright test-results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results
      - name: Show server log
        if: always()
        run: cat server.log || true

  Build:
    name: Build-App
    runs-on: ubuntu-latest
    env:
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
    needs:
      - Lint
      - Type-Check
      - Unit-Tests
      - E2E-Tests
      # - Visual-Regression-Tests
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PUBLIC_GA_MEASUREMENT_ID
        run: |
          if [ -z "$PUBLIC_GA_MEASUREMENT_ID" ]; then
            echo "Error: PUBLIC_GA_MEASUREMENT_ID is not configured in GitHub repository variables"
            echo "Please configure it in: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          echo "PUBLIC_GA_MEASUREMENT_ID is configured"
      - run: pnpm build
