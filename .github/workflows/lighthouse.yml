name: Lighthouse

# Mide producción y añade el resultado a lh.ndjson en la rama `metrics`.
# Semanal, más `workflow_dispatch` para lanzarlo a mano después de un deploy
# que quieras medir.
#
# Deliberadamente NO se dispara con `push: master`: Render despliega en paralelo
# al workflow y no hay forma de saber si erades.com ya sirve el commit nuevo,
# así que medir ahí registraría la versión vieja bajo el hash nuevo.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: lighthouse
  cancel-in-progress: false

env:
  NODE_VERSION: 22.13.x

jobs:
  Measure:
    name: Measure-Production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master (el código)
        uses: actions/checkout@v7

      # El registro va a su propia rama porque Render tiene autoDeploy por
      # commit sobre master, sin caché: commitear ahí dispararía un rebuild
      # completo de producción cada semana por un fichero que no toca el sitio.
      # Render no mira esta rama, así que no despliega nada.
      - name: Checkout rama metrics (el registro)
        uses: actions/checkout@v7
        with:
          ref: metrics
          path: .metrics-branch

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Recoger métricas (mobile + desktop)
        run: pnpm lh:collect

      - name: Añadir fila al registro
        run: pnpm lh:record
        env:
          LH_OUT: ${{ github.workspace }}/.metrics-branch/lh.ndjson

      - name: Commit en la rama metrics
        working-directory: .metrics-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lh.ndjson
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
            exit 0
          fi
          git commit -m "chore(lh): registro de $(date -I)"
          git pull --rebase origin metrics
          git push origin HEAD:metrics
